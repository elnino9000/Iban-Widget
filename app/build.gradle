plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.iban.widget'
    compileSdk 34

    defaultConfig {
        applicationId "com.iban.sendwidget"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        gunluk {
            storeFile file('gunluk.keystore')
            storePassword 'android'
            keyAlias 'gunluk'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gunluk
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.gunluk
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
